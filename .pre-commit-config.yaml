repos:
  - repo: local
    hooks:
      - id: make-spelling
        name: Run make spelling
        entry: make -C docs spelling
        language: system
        pass_filenames: false
        files: ^docs/.*\.(rst|md|txt)$

      - id: make-linkcheck
        name: Run make linkcheck
        entry: make -C docs linkcheck
        language: system
        pass_filenames: false
        files: ^docs/.*\.(rst|md|txt)$

      - id: make-woke
        name: Run make woke
        entry: make -C docs woke
        language: system
        pass_filenames: false
        files: ^docs/.*\.(rst|md|txt)$

      - id: make-doctest
        name: Run make doctest
        entry: make -C docs doctest
        language: system
        pass_filenames: false
        files: ^docs/.*\.(rst|md)$

      - id: make-cram
        name: Run make cram
        entry: make -C docs cram
        language: system
        pass_filenames: false
        files: ^docs/_dev/tests/.*\.t$
