<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" role="img" aria-labelledby="title desc">
  <title id="title">Trust boundaries in a device running Zephyr</title>
  <desc id="desc">External entities on the left (network peers, radio peers, management clients, USB hosts and devices, log and console readers, and physical access) connect across the device boundary to protocol stacks running in kernel mode. A system call boundary separates kernel mode from user-mode application threads and loadable extensions. The MCUboot bootloader verifies firmware images before they run. The hardware layer contains the MPU, DMA controllers, debug port, flash, random number generator, and radios. Numbered markers 1 to 9 identify the trust boundaries described in the accompanying table.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
    <style>
      text { font-family: Ubuntu, Arial, sans-serif; fill: #111111; }
      .zone-label { font-size: 15px; font-weight: bold; }
      .label { font-size: 13px; }
      .small { font-size: 12px; fill: #333333; }
      .ext { fill: #f5f5f5; stroke: #666666; stroke-width: 1.5; }
      .kernel-zone { fill: #eef3f9; stroke: none; }
      .kernel { fill: #d6e4f2; stroke: #33557a; stroke-width: 1.5; }
      .user-zone { fill: #f1f6ee; stroke: none; }
      .user { fill: #dcebd3; stroke: #4d7a3a; stroke-width: 1.5; }
      .boot { fill: #fbe9e1; stroke: #a8411a; stroke-width: 1.5; }
      .hw-zone { fill: #f0f0f0; stroke: #555555; stroke-width: 1.5; }
      .hw { fill: #ffffff; stroke: #555555; stroke-width: 1.2; }
      .device { fill: #ffffff; stroke: #333333; stroke-width: 2; }
      .tb { stroke: #e95420; stroke-width: 2.5; stroke-dasharray: 8 5; fill: none; }
      .flow { stroke: #333333; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .num circle { fill: #e95420; stroke: #ffffff; stroke-width: 1.5; }
      .num text { fill: #ffffff; font-size: 13px; font-weight: bold; }
    </style>
  </defs>

  <!-- Outside the device -->
  <text class="zone-label" x="120" y="80" text-anchor="middle">Outside the device</text>

  <rect class="ext" x="20" y="100" width="200" height="54" rx="6"/>
  <text class="label" x="120" y="123" text-anchor="middle">Network peers</text>
  <text class="small" x="120" y="141" text-anchor="middle">Ethernet, Wi-Fi</text>

  <rect class="ext" x="20" y="170" width="200" height="54" rx="6"/>
  <text class="label" x="120" y="193" text-anchor="middle">Radio peers</text>
  <text class="small" x="120" y="211" text-anchor="middle">Bluetooth LE, Thread</text>

  <rect class="ext" x="20" y="240" width="200" height="54" rx="6"/>
  <text class="label" x="120" y="263" text-anchor="middle">Management clients</text>
  <text class="small" x="120" y="281" text-anchor="middle">MCUmgr, shell</text>

  <rect class="ext" x="20" y="310" width="200" height="54" rx="6"/>
  <text class="label" x="120" y="342" text-anchor="middle">USB hosts and devices</text>

  <rect class="ext" x="20" y="380" width="200" height="54" rx="6"/>
  <text class="label" x="120" y="403" text-anchor="middle">Log and console readers</text>
  <text class="small" x="120" y="421" text-anchor="middle">UART, RTT, network</text>

  <rect class="ext" x="20" y="560" width="200" height="54" rx="6"/>
  <text class="label" x="120" y="583" text-anchor="middle">Physical access</text>
  <text class="small" x="120" y="601" text-anchor="middle">debug probe, flash readout</text>

  <!-- Legend -->
  <line class="tb" x1="30" y1="475" x2="70" y2="475"/>
  <text class="small" x="80" y="479">Trust boundary</text>
  <g class="num"><circle cx="50" cy="505" r="11"/><text x="50" y="510" text-anchor="middle">n</text></g>
  <text class="small" x="80" y="509">Crossing, see the table</text>

  <!-- Device -->
  <rect class="device" x="250" y="20" width="730" height="620" rx="8"/>
  <text class="zone-label" x="265" y="46">Device running Zephyr</text>

  <!-- Kernel mode -->
  <rect class="kernel-zone" x="270" y="60" width="420" height="390"/>
  <text class="zone-label" x="285" y="84">Kernel mode (trusted)</text>

  <rect class="kernel" x="290" y="100" width="180" height="54" rx="6"/>
  <text class="label" x="380" y="123" text-anchor="middle">Network stack</text>
  <text class="label" x="380" y="141" text-anchor="middle">and TLS</text>

  <rect class="kernel" x="290" y="170" width="180" height="54" rx="6"/>
  <text class="label" x="380" y="193" text-anchor="middle">Bluetooth and</text>
  <text class="label" x="380" y="211" text-anchor="middle">Thread stacks</text>

  <rect class="kernel" x="290" y="240" width="180" height="54" rx="6"/>
  <text class="label" x="380" y="272" text-anchor="middle">MCUmgr and shell</text>

  <rect class="kernel" x="290" y="310" width="180" height="54" rx="6"/>
  <text class="label" x="380" y="342" text-anchor="middle">USB stack</text>

  <rect class="kernel" x="290" y="380" width="180" height="54" rx="6"/>
  <text class="label" x="380" y="403" text-anchor="middle">Logging and</text>
  <text class="label" x="380" y="421" text-anchor="middle">coredump</text>

  <rect class="kernel" x="490" y="100" width="180" height="124" rx="6"/>
  <text class="label" x="580" y="146" text-anchor="middle">Kernel and scheduler</text>
  <text class="small" x="580" y="166" text-anchor="middle">system call checks,</text>
  <text class="small" x="580" y="184" text-anchor="middle">object permissions</text>

  <rect class="kernel" x="490" y="240" width="180" height="54" rx="6"/>
  <text class="label" x="580" y="263" text-anchor="middle">PSA Crypto</text>
  <text class="label" x="580" y="281" text-anchor="middle">and entropy</text>

  <rect class="kernel" x="490" y="310" width="180" height="54" rx="6"/>
  <text class="label" x="580" y="333" text-anchor="middle">Settings and</text>
  <text class="label" x="580" y="351" text-anchor="middle">secure storage</text>

  <rect class="kernel" x="490" y="380" width="180" height="54" rx="6"/>
  <text class="label" x="580" y="412" text-anchor="middle">Device drivers</text>

  <!-- User mode -->
  <rect class="user-zone" x="715" y="60" width="250" height="390"/>
  <text class="zone-label" x="730" y="84">User mode (untrusted)</text>

  <rect class="user" x="735" y="100" width="210" height="124" rx="6"/>
  <text class="label" x="840" y="166" text-anchor="middle">Application threads</text>

  <rect class="user" x="735" y="240" width="210" height="54" rx="6"/>
  <text class="label" x="840" y="263" text-anchor="middle">Loadable extensions</text>
  <text class="small" x="840" y="281" text-anchor="middle">LLEXT</text>

  <!-- Boundary 1: system calls -->
  <line class="tb" x1="702" y1="60" x2="702" y2="450"/>
  <line class="flow" x1="735" y1="180" x2="672" y2="180"/>

  <!-- Boot -->
  <rect class="boot" x="270" y="470" width="695" height="60" rx="6"/>
  <text class="label" x="617" y="495" text-anchor="middle">MCUboot bootloader</text>
  <text class="small" x="617" y="514" text-anchor="middle">verifies the signature and version of each firmware image before it runs</text>
  <line class="tb" x1="270" y1="460" x2="965" y2="460"/>

  <!-- Hardware -->
  <rect class="hw-zone" x="270" y="545" width="695" height="80" rx="6"/>
  <text class="zone-label" x="285" y="566">Hardware</text>
  <rect class="hw" x="290" y="578" width="100" height="36" rx="4"/>
  <text class="label" x="340" y="601" text-anchor="middle">MPU</text>
  <rect class="hw" x="400" y="578" width="100" height="36" rx="4"/>
  <text class="label" x="450" y="601" text-anchor="middle">DMA</text>
  <rect class="hw" x="510" y="578" width="100" height="36" rx="4"/>
  <text class="label" x="560" y="601" text-anchor="middle">Debug port</text>
  <rect class="hw" x="620" y="578" width="100" height="36" rx="4"/>
  <text class="label" x="670" y="601" text-anchor="middle">Flash</text>
  <rect class="hw" x="730" y="578" width="100" height="36" rx="4"/>
  <text class="label" x="780" y="601" text-anchor="middle">TRNG</text>
  <rect class="hw" x="840" y="578" width="100" height="36" rx="4"/>
  <text class="label" x="890" y="601" text-anchor="middle">Radios</text>

  <!-- Flows across the device boundary -->
  <line class="flow" x1="220" y1="127" x2="288" y2="127"/>
  <line class="flow" x1="220" y1="197" x2="288" y2="197"/>
  <line class="flow" x1="220" y1="267" x2="288" y2="267"/>
  <line class="flow" x1="220" y1="337" x2="288" y2="337"/>
  <line class="flow" x1="290" y1="407" x2="222" y2="407"/>
  <line class="flow" x1="220" y1="587" x2="268" y2="587"/>

  <!-- Numbered crossings -->
  <g class="num"><circle cx="702" cy="140" r="11"/><text x="702" y="145" text-anchor="middle">1</text></g>
  <g class="num"><circle cx="250" cy="127" r="11"/><text x="250" y="132" text-anchor="middle">2</text></g>
  <g class="num"><circle cx="250" cy="197" r="11"/><text x="250" y="202" text-anchor="middle">3</text></g>
  <g class="num"><circle cx="250" cy="267" r="11"/><text x="250" y="272" text-anchor="middle">4</text></g>
  <g class="num"><circle cx="250" cy="337" r="11"/><text x="250" y="342" text-anchor="middle">5</text></g>
  <g class="num"><circle cx="250" cy="407" r="11"/><text x="250" y="412" text-anchor="middle">6</text></g>
  <g class="num"><circle cx="250" cy="587" r="11"/><text x="250" y="592" text-anchor="middle">7</text></g>
  <g class="num"><circle cx="300" cy="460" r="11"/><text x="300" y="465" text-anchor="middle">8</text></g>
  <g class="num"><circle cx="735" cy="240" r="11"/><text x="735" y="245" text-anchor="middle">9</text></g>
</svg>
