name: |workshop_name|
base: |workshop_base|
sdks:
  - name: uv
    channel: latest/stable
  - name: zephyr
    channel: |workshop_sdk_channel|
  - name: zephyr-sdk-ng
    channel: |sdk_ng_channel|
  - name: zephyr-amd64
    channel: |sdk_ng_channel|
connections:
  - plug: zephyr:venv
    slot: uv:venv
  - plug: zephyr:sdk-ng
    slot: zephyr-sdk-ng:sdk-ng
  - plug: zephyr-sdk-ng:amd64
    slot: zephyr-amd64:toolchain
actions:
  sync: |
    west update "$@"
  build: |
    source /var/lib/workshop/sdk/zephyr/venv/bin/activate
    cd /project/zephyr
    west build "$@"
  flash: |
    source /var/lib/workshop/sdk/zephyr/venv/bin/activate
    cd /project/zephyr
    west flash "$@"
